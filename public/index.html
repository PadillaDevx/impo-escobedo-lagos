  <!-- Anti-FOUC: aplica tema e idioma antes que React monte -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('impo-theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.style.colorScheme = 'light';
        }
        var lang = localStorage.getItem('impo-lang');
        if (lang === 'en' || lang === 'es') {
          document.documentElement.lang = lang;
        } else {
          document.documentElement.lang = 'es';
        }
      } catch (e) { /* noop */ }
    })();
  </script>


  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background-color: #FCF9F2;
    }

    html.dark,
    html.dark body {
      background-color: #0F1B2A;
    }
  </style>
</head>
